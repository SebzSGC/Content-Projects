[project]
name = "gameclips"
version = "0.1.0"
description = "Worker de ClippersIppers: genera Shorts verticales (facecam + gameplay) a partir de streams de videojuegos."
requires-python = ">=3.10"
dependencies = [
  # API y núcleo
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.8",
  "numpy>=1.26",
  "soundfile>=0.12",
  # Ingesta (Kick necesita curl_cffi para la suplantación de navegador)
  "yt-dlp[default,curl-cffi]>=2026.10.21",
  # Audio
  "demucs>=4.0.1",
  "faster-whisper>=1.1",
  "panns-inference>=0.1.1",
  "speechbrain>=1.0",
  "torch>=2.3",
  "torchaudio>=2.3",
  # Visión
  "opencv-python-headless>=4.10",
  "mediapipe>=0.10.14",
  "paddleocr>=2.8",
]

[project.optional-dependencies]
# Proveedor de IA: instala solo el que uses (CLIPS_LLM_PROVIDER).
claude = ["anthropic>=1.0"]
openai = ["openai>=1.60"]  # también para Groq, OpenRouter, Ollama, LM Studio… (openai_compatible)
gemini = ["google-genai>=1.30"]
all-llm = ["anthropic>=1.0", "openai>=1.60", "google-genai>=1.30"]
dev = ["pytest>=8"]

[project.scripts]
gameclips = "gameclips.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
