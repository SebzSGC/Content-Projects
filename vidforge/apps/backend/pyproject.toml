[project]
name = "vidforge"
version = "1.0.0"
description = "Clean-room modular AI video generator and multi-track studio"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1.0",
    "httpx>=0.27.0",
    "rapidfuzz>=3.9.0",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
    "pillow>=10.4.0",
    "faster-whisper>=1.0.3",
    "keyring>=25.2.0",
    "cryptography>=43.0.0",
    "psutil>=6.0.0",
    "pywin32>=306; sys_platform == 'win32'",
    "pywebview>=5.2",
    "jsonschema>=4.23.0",
    "pyttsx3>=2.90",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "hypothesis>=6.112.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
