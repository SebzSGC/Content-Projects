<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100vw; height: 100vh; overflow: hidden;
    background: transparent;
    font-family: 'Georgia', serif;
    display: flex; align-items: center; justify-content: center;
  }
  .qcard {
    max-width: 1200px; padding: 60px 76px;
    background: rgba(15, 23, 42, 0.92);
    border-left: 10px solid #a855f7;
    border-radius: 24px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.65);
  }
  .qtext {
    font-size: 52px; line-height: 1.3; color: #f8fafc; font-style: italic;
  }
  .qauthor {
    margin-top: 28px; font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 28px; font-weight: 700; color: #c084fc; text-transform: uppercase; letter-spacing: 2px;
  }
</style>
</head>
<body>
  <div class="qcard" id="qcard">
    <div class="qtext" id="qt">“La simplicidad es la máxima sofisticación.”</div>
    <div class="qauthor" id="qa">— Nota Editorial</div>
  </div>
<script>
  let dur = 4000;
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  window.__vf = {
    async init(props = {}) {
      dur = Math.round((props.duration_us ?? 4000000) / 1000);
      document.getElementById("qt").textContent = `“${props.quote ?? "Idea clave"}”`;
      document.getElementById("qa").textContent = props.author ? `— ${props.author}` : "";
      await this.seek(0);
    },
    durationMs() { return dur; },
    async seek(tMs) {
      const inp = easeOut(clamp(tMs / 500, 0, 1));
      const outp = tMs > dur - 400 ? clamp((dur - tMs) / 400, 0, 1) : 1;
      const p = inp * outp;
      const el = document.getElementById("qcard");
      el.style.opacity = p.toFixed(3);
      el.style.transform = `scale(${(0.9 + 0.1 * p).toFixed(3)})`;
    }
  };
</script>
</body>
</html>
