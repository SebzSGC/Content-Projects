<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100vw; height: 100vh; overflow: hidden;
    background: transparent;
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .container {
    width: 84%; max-width: 1500px;
    background: rgba(15, 23, 42, 0.92);
    border-radius: 28px; padding: 52px 64px;
    border: 2px solid rgba(56, 189, 248, 0.35);
    box-shadow: 0 25px 60px rgba(0,0,0,0.65);
  }
  .title { font-size: 44px; font-weight: 800; color: #f8fafc; margin-bottom: 36px; text-align: center; }
  .steps { display: flex; gap: 28px; justify-content: space-between; }
  .step {
    flex: 1; padding: 32px; border-radius: 20px;
    background: rgba(30, 41, 59, 0.9);
    border: 2px solid #38bdf8;
    color: #f8fafc; font-size: 32px; font-weight: 700; text-align: center;
  }
</style>
</head>
<body>
  <div class="container" id="cont">
    <div class="title" id="title">Proceso Clave</div>
    <div class="steps" id="steps"></div>
  </div>
<script>
  let dur = 4500;
  let items = ["1. Diagnóstico", "2. Ejecución", "3. Resultados"];
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  window.__vf = {
    async init(props = {}) {
      dur = Math.round((props.duration_us ?? 4500000) / 1000);
      document.getElementById("title").textContent = props.title ?? "Proceso Clave";
      items = Array.isArray(props.steps) && props.steps.length ? props.steps : ["1. Diagnóstico", "2. Ejecución", "3. Resultados"];
      const stepsEl = document.getElementById("steps");
      stepsEl.innerHTML = items.map((s, idx) => `<div class="step" id="st_${idx}">${s}</div>`).join("");
      await this.seek(0);
    },
    durationMs() { return dur; },
    async seek(tMs) {
      const out = tMs > dur - 350 ? clamp((dur - tMs) / 350, 0, 1) : 1;
      document.getElementById("cont").style.opacity = out.toFixed(3);
      items.forEach((_, idx) => {
        const p = easeOut(clamp((tMs - idx * 250) / 450, 0, 1));
        const el = document.getElementById(`st_${idx}`);
        if (el) {
          el.style.opacity = p.toFixed(3);
          el.style.transform = `translateY(${((1 - p) * 40).toFixed(1)}px)`;
        }
      });
    }
  };
</script>
</body>
</html>
