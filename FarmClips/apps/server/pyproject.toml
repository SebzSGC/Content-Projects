[project]
name = "clipsserver"
version = "0.2.0"
description = "Proceso único local de ClipsApp: API HTTP + SSE, orquestador SQLite idempotente y tres pools (API, CPU, Render)."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.8",
  "httpx>=0.27",
  "clipscore",
  "clipsproviders",
  "clipsmedia",
  "clipstracking",
  "clipseditplan",
  "clipsrender",
  "clipsstyles",
]

[project.scripts]
clipsserver = "clipsserver.main:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["clipsserver*"]
