[project]
name = "clipsmedia"
version = "0.2.0"
description = "FFmpeg wrappers, corte por silencios (Opus 16kHz), sincronización de audio y conector Google Drive con reanudación."
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.8",
  "numpy>=1.26",
  "soundfile>=0.12",
  "httpx>=0.27",
  "cryptography>=42.0",
  "clipscore",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["clipsmedia*"]
