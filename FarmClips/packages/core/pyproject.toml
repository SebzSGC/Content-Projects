[project]
name = "clipscore"
version = "0.2.0"
description = "Dominio y lógica pura de ClipsApp: timeline, señales, selección por IDs de frase, framing (One Euro + RDP) y directores de EditPlan."
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.8",
  "numpy>=1.26",
  "pyarrow>=17.0",
  "soundfile>=0.12",
  "clipseditplan",
  "clipsstyles",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["clipscore*"]
