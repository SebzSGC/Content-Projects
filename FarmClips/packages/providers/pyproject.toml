[project]
name = "clipsproviders"
version = "0.2.0"
description = "Adaptadores HTTP asíncronos para STT (Deepgram Nova-3, Groq Whisper turbo) y LLM (Gemini 3.5/3.8 Flash, OpenAI-compat) con limitador, reintentos y cortacircuitos."
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.8",
  "clipscore",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["clipsproviders*"]
