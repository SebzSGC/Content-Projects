[project]
name = "clipseditplan"
version = "0.2.0"
description = "Esquema declarativo EditPlan v2 (JSON Schema -> Pydantic y TypeScript)."
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.8",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["clipseditplan*"]
