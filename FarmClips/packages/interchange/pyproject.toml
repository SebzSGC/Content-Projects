[project]
name = "clipsinterchange"
version = "0.1.0"
description = "Motor de intercambio de timelines para FarmClips (FilmCraft, OTIO, Premiere, DaVinci)."
requires-python = ">=3.10"
dependencies = [
  "clipseditplan>=0.2.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["clipsinterchange*"]
